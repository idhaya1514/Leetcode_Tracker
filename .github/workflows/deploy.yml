name: Production CD Pipeline

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Trigger Server Local Deployment Script
        run: |
          # Try to run deploy script, but don't fail the action if pm2 restart fails
          ~/deploy.sh || echo "Deployment script had an error (likely pm2), but frontend might have deployed!"
